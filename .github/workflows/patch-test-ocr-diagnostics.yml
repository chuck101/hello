name: Apply OCR speed patch

on:
  push:
    branches: ["master"]
    paths:
      - "czk-pln/speed-trigger.txt"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply fast live OCR changes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          # Main camera: faster image, immediate result, fast repeated scans.
          p=Path('czk-pln/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('const defaults={scanWidth:55,scanHeight:18,contrast:17,confidence:45,stability:2};',
                      'const defaults={scanWidth:55,scanHeight:18,contrast:17,confidence:45,stability:1};')
          s=s.replace('tw=Math.min(900,Math.max(420,Math.round(sw)))',
                      'tw=Math.min(720,Math.max(380,Math.round(sw)))')
          s=s.replace("tessedit_char_whitelist:'0123456789,.'", "tessedit_char_whitelist:'0123456789,.-'")

          marker="""    if(full){const n=num(full[1]);if(n>.05&&n<100000){const c=candidateScore(n,bi.b,conf,3.2);c.text=full[1];c.kind='decimal';a.push(c)}}
"""
          addition=marker+"""    const dash=t.match(/(?:^|[^0-9])(\\d{1,5})(?:[.,])?-(?:[^0-9]|$)/);
    if(dash){const n=Number(dash[1]);if(n>.05&&n<100000){const c=candidateScore(n,bi.b,conf,4.0);c.text=dash[0];c.kind='whole-dash';a.push(c)}}
"""
          if "c.kind='whole-dash'" not in s:
              if marker not in s: raise SystemExit('index dash marker missing')
              s=s.replace(marker,addition,1)

          old="let w=await getWorker(),r=await w.recognize(canvas,{}, {text:true,blocks:true}),c=chooseCandidate(r.data);"
          new="let w=await getWorker();window.OCR_LIVE_FAST=true;let r=await w.recognize(canvas,{}, {text:true,blocks:true});window.OCR_LIVE_FAST=false;let c=chooseCandidate(r.data);"
          if old in s:s=s.replace(old,new,1)
          elif new not in s:raise SystemExit('live fast scan marker missing')
          s=s.replace('finally{busy=false;if(running)timer=setTimeout(scan,500)}',
                      'finally{window.OCR_LIVE_FAST=false;busy=false;if(running)timer=setTimeout(scan,120)}')
          s=s.replace('timer=setTimeout(scan,250)','timer=setTimeout(scan,80)')
          p.write_text(s,encoding='utf-8')

          # Existing expensive fallbacks stay available for static tests, but not every live frame.
          p=Path('czk-pln/ocr-smart.js');s=p.read_text(encoding='utf-8')
          old='if(!hasDecimalCandidate(result.data)&&image instanceof HTMLCanvasElement){'
          new='if(!window.OCR_LIVE_FAST&&!hasDecimalCandidate(result.data)&&image instanceof HTMLCanvasElement){'
          if old in s:s=s.replace(old,new,1)
          elif new not in s:raise SystemExit('ocr-smart live guard marker missing')
          p.write_text(s,encoding='utf-8')

          p=Path('czk-pln/ocr-runtime-v2.js');s=p.read_text(encoding='utf-8')
          old='const image=rargs[0];if(!(image instanceof HTMLCanvasElement)||structuredAlready(result.data))return result;'
          new='const image=rargs[0];if(window.OCR_LIVE_FAST)return result;if(!(image instanceof HTMLCanvasElement)||structuredAlready(result.data))return result;'
          if old in s:s=s.replace(old,new,1)
          elif new not in s:raise SystemExit('runtime live guard marker missing')
          p.write_text(s,encoding='utf-8')

          # Test mode: one cheap pass first. Sparse/binary only when the first pass has no structured price.
          p=Path('czk-pln/test-mode.js');s=p.read_text(encoding='utf-8')
          old="""    for(const m of s.matchAll(/(?:^|[^0-9])(\\d{1,4})\\s*([,.])\\s*-(?!\\d)/g)){const n=Number(m[1]);if(n>.05&&n<100000)out.push({n,kind:'whole-dash',quality:8})}
    return out;
"""
          new="""    for(const m of s.matchAll(/(?:^|[^0-9])(\\d{1,4})\\s*([,.])\\s*-(?!\\d)/g)){const n=Number(m[1]);if(n>.05&&n<100000)out.push({n,kind:'whole-dash',quality:8})}
    for(const m of s.matchAll(/(?:^|[^0-9])(\\d{1,4})\\s*-(?!\\d)/g)){const n=Number(m[1]);if(n>.05&&n<100000)out.push({n,kind:'whole-dash',quality:7})}
    return out;
"""
          if old in s:s=s.replace(old,new,1)
          elif "kind:'whole-dash',quality:7" not in s:raise SystemExit('test dash marker missing')

          s=s.replace('const outW=Math.min(1200,Math.max(640,Math.round(sw*4)))',
                      'const outW=Math.min(820,Math.max(480,Math.round(sw*2.8)))')

          old="""      passes.push(await onePass(worker,source,'linia','soft',7));if(token!==recognizeToken||!active)return null;
      passes.push(await onePass(worker,source,'sparse','normal',11));if(token!==recognizeToken||!active)return null;
      passes.push(await onePass(worker,source,'binary','binary',7));if(token!==recognizeToken||!active)return null;
      try{await worker.setParameters({tessedit_pageseg_mode:'7',tessedit_char_whitelist:'0123456789,.-'})}catch{}
      const chosen=pickMultiPass(passes),got=chosen?.n??null,known=hasExpected(label),ok=known&&got!==null&&Math.abs(got-Number(label.expected))<.011,result={got,ok,known,kind:chosen?.kind||null,diag:diagnosticPasses(passes)};
"""
          new="""      passes.push(await onePass(worker,source,'linia','soft',7));if(token!==recognizeToken||!active)return null;
      let chosen=pickMultiPass(passes);
      if(!chosen?.structured){passes.push(await onePass(worker,source,'sparse','normal',11));if(token!==recognizeToken||!active)return null;chosen=pickMultiPass(passes)}
      if(!chosen?.structured){passes.push(await onePass(worker,source,'binary','binary',7));if(token!==recognizeToken||!active)return null;chosen=pickMultiPass(passes)}
      try{await worker.setParameters({tessedit_pageseg_mode:'7',tessedit_char_whitelist:'0123456789,.-'})}catch{}
      const got=chosen?.n??null,known=hasExpected(label),ok=known&&got!==null&&Math.abs(got-Number(label.expected))<.011,result={got,ok,known,kind:chosen?.kind||null,diag:diagnosticPasses(passes)};
"""
          if old in s:s=s.replace(old,new,1)
          elif 'let chosen=pickMultiPass(passes);' not in s:raise SystemExit('test fast-first marker missing')
          s=s.replace('gestureTimer=setTimeout(()=>{if(active&&!auto)recognizeCurrentView()},320)',
                      'gestureTimer=setTimeout(()=>{if(active&&!auto)recognizeCurrentView()},100)')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add czk-pln/index.html czk-pln/test-mode.js czk-pln/ocr-smart.js czk-pln/ocr-runtime-v2.js
          git diff --cached --quiet && exit 0
          git commit -m "Speed up live price OCR"
          git push origin HEAD:master

      - name: Deploy Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref master
