# trigger: collector workflow already exists on default branch
name: Collect 20 real Czech price labels v2

on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/collect-real-labels-v2.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install image/OCR tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-ces
          python3 -m pip install --quiet pillow

      - name: Collect 20 permanent real Czech price-label fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import html, json, math, re, shutil, subprocess, time, urllib.parse, urllib.request, urllib.error
          from collections import deque
          from pathlib import Path
          from PIL import Image, ImageOps

          API='https://commons.wikimedia.org/w/api.php'
          UA='czk-pln-real-label-fixtures/3.0 (+https://github.com/chuck101/hello)'
          ROOT='Category:Price tags in the Czech Republic'
          OUT=Path('czk-pln/real-labels')
          TMP=Path('/tmp/czk-real-labels-v3')
          TARGET=20

          def open_retry(url, timeout=60, max_bytes=None, attempts=6):
              last=None
              for attempt in range(attempts):
                  try:
                      req=urllib.request.Request(url,headers={
                          'User-Agent':UA,
                          'Accept':'application/json,image/avif,image/webp,image/apng,image/*,*/*;q=0.8',
                      })
                      with urllib.request.urlopen(req,timeout=timeout) as r:
                          data=r.read((max_bytes+1) if max_bytes else None)
                          if max_bytes and len(data)>max_bytes:
                              raise RuntimeError('download too large')
                          return data
                  except urllib.error.HTTPError as e:
                      last=e
                      if e.code!=429:
                          raise
                      retry=e.headers.get('Retry-After') if e.headers else None
                      try: delay=max(8,int(retry)) if retry else min(60,8*(2**attempt))
                      except: delay=min(60,8*(2**attempt))
                      print(f'HTTP 429; sleeping {delay}s before retry {attempt+2}/{attempts}',flush=True)
                      time.sleep(delay)
                  except Exception as e:
                      last=e
                      if attempt==attempts-1: raise
                      delay=min(30,3*(attempt+1))
                      print(f'Network error {e}; sleeping {delay}s',flush=True)
                      time.sleep(delay)
              raise last or RuntimeError('request failed')

          def api(params):
              q=dict(params); q.update(format='json',formatversion='2',maxlag='5')
              url=API+'?'+urllib.parse.urlencode(q)
              data=open_retry(url,timeout=45,attempts=6)
              time.sleep(1.1)
              return json.loads(data.decode('utf-8'))

          def category_members(category):
              cont=None
              while True:
                  p={'action':'query','list':'categorymembers','cmtitle':category,'cmtype':'file|subcat','cmlimit':'max'}
                  if cont: p['cmcontinue']=cont
                  j=api(p)
                  yield from j.get('query',{}).get('categorymembers',[])
                  cont=j.get('continue',{}).get('cmcontinue')
                  if not cont: break

          def recursive_files(root,max_depth=6,max_files=500):
              q=deque([(root,0)])
              seen_cat=set(); seen_file=set(); out=[]
              while q and len(out)<max_files:
                  cat,depth=q.popleft()
                  if cat in seen_cat or depth>max_depth: continue
                  seen_cat.add(cat)
                  try:
                      members=list(category_members(cat))
                  except Exception as e:
                      print('WARN category',cat,e,flush=True); continue
                  for x in members:
                      title=x.get('title',''); ns=x.get('ns')
                      if ns==14 and depth<max_depth:
                          q.append((title,depth+1))
                      elif ns==6 and title not in seen_file:
                          seen_file.add(title); out.append((title,cat))
              return out

          def strip_html(s):
              return re.sub(r'<[^>]+>',' ',html.unescape(str(s or ''))).strip()

          def batch_file_info(file_pairs):
              # Key improvement: metadata for up to 25 files in ONE Commons API call,
              # instead of one request per file. This avoids the 429 storm.
              by_title={title:parent for title,parent in file_pairs}
              out=[]
              titles=list(by_title)
              for start in range(0,len(titles),25):
                  chunk=titles[start:start+25]
                  j=api({
                      'action':'query',
                      'titles':'|'.join(chunk),
                      'prop':'imageinfo|categories',
                      'iiprop':'url|mime|extmetadata',
                      'iiurlwidth':'1100',
                      'cllimit':'max',
                  })
                  for p in j.get('query',{}).get('pages',[]):
                      title=p.get('title','')
                      ii=(p.get('imageinfo') or [{}])[0]
                      if ii.get('mime') not in ('image/jpeg','image/png','image/webp'): continue
                      ext=ii.get('extmetadata') or {}
                      def mv(k):
                          v=ext.get(k,{})
                          if isinstance(v,dict): v=v.get('value','')
                          return strip_html(v)
                      out.append({
                          'title':title,
                          'parent_category':by_title.get(title,''),
                          'thumb':ii.get('thumburl') or ii.get('url'),
                          'original':ii.get('url'),
                          'source_page':'https://commons.wikimedia.org/wiki/'+urllib.parse.quote(title.replace(' ','_'),safe=':/_()'),
                          'author':mv('Artist'),
                          'license':mv('LicenseShortName'),
                          'license_url':mv('LicenseUrl'),
                          'description':mv('ImageDescription'),
                          'categories':[c.get('title','') for c in p.get('categories',[])],
                      })
              return out

          SHOP_WORDS=('penny','lidl','tesco','billa','albert','kaufland','supermarket','prodejna','obchod','mléko','potravin','pečivo','pekárna','market')

          def rank(info):
              blob=(' '.join([info['title'],info['parent_category'],info['description'],*info['categories']])).lower()
              score=sum(8 for x in SHOP_WORDS if x in blob)
              if '(price tag)' in blob: score+=5
              if 'price tags in the czech republic' in blob: score+=4
              return score

          def parse_expected(info):
              for c in [info['parent_category']]+info['categories']:
                  m=re.search(r'Category:(\d{1,4})[\.,](\d{2})\s*\(price tag\)',c,re.I)
                  if m:
                      v=int(m.group(1))+int(m.group(2))/100
                      if .05<v<100000: return round(v,2),c
              return None,None

          def download(url,path):
              data=open_retry(url,timeout=70,max_bytes=12*1024*1024,attempts=6)
              path.write_bytes(data)
              # Be deliberately polite to upload.wikimedia.org.
              time.sleep(2.5)

          def normalize(src,dst):
              with Image.open(src) as im:
                  im=ImageOps.exif_transpose(im).convert('RGB')
                  im.thumbnail((1200,1200),Image.Resampling.LANCZOS)
                  im.save(dst,'JPEG',quality=91,optimize=True)

          def tsv(path):
              p=subprocess.run(['tesseract',str(path),'stdout','-l','ces+eng','--psm','11','tsv'],stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,text=True,timeout=60)
              lines=p.stdout.splitlines(); rows=[]
              if not lines:return rows
              hdr=lines[0].split('\t')
              for line in lines[1:]:
                  cols=line.split('\t')
                  if len(cols)!=len(hdr):continue
                  d=dict(zip(hdr,cols)); text=(d.get('text') or '').strip()
                  if not text:continue
                  try:
                      for k in ('left','top','width','height'): d[k]=int(d[k])
                      d['conf']=float(d['conf'])
                  except:continue
                  rows.append(d)
              return rows

          def largest_numeric(rows):
              nums=[]
              for r in rows:
                  if re.search(r'\d',r['text']) and r['conf']>=0:
                      nums.append((max(1,r['width']*r['height']),r))
              return max(nums,key=lambda x:x[0])[1] if nums else None

          def crop_real(src,dst,rows):
              with Image.open(src) as im:
                  im=im.convert('RGB'); W,H=im.size; a=largest_numeric(rows)
                  if a:
                      cx=a['left']+a['width']/2; cy=a['top']+a['height']/2
                      ch=min(H,max(180,int(a['height']*6.0)))
                      cw=min(W,max(450,int(ch*2.5)))
                      ch=min(H,max(1,int(cw/2.5)))
                      x0=max(0,min(W-cw,int(cx-cw*.45)))
                      y0=max(0,min(H-ch,int(cy-ch*.50)))
                      crop=im.crop((x0,y0,x0+cw,y0+ch))
                  else:
                      target=2.5
                      if W/H>target:
                          cw=int(H*target); x0=(W-cw)//2; crop=im.crop((x0,0,x0+cw,H))
                      else:
                          ch=int(W/target); y0=(H-ch)//2; crop=im.crop((0,y0,W,y0+ch))
                  crop=crop.resize((900,360),Image.Resampling.LANCZOS)
                  crop.save(dst,'JPEG',quality=93,optimize=True)

          def diagnostic(rows):
              return ' '.join(r['text'] for r in rows)[:600]

          shutil.rmtree(TMP,ignore_errors=True); TMP.mkdir(parents=True)
          OUT.mkdir(parents=True,exist_ok=True)
          for p in OUT.glob('real-*.jpg'): p.unlink()
          for n in ('manifest.json','SOURCES.md'):
              p=OUT/n
              if p.exists():p.unlink()

          files=recursive_files(ROOT,max_depth=6,max_files=350)
          print('Price-tag category tree files:',len(files),flush=True)
          if len(files)<TARGET:
              raise SystemExit(f'Commons category tree has only {len(files)} files')

          infos=batch_file_info(files)
          infos.sort(key=lambda x:(-rank(x),x['title']))
          print('Metadata loaded:',len(infos),'Top candidates:',[(rank(x),x['title']) for x in infos[:8]],flush=True)

          accepted=[]
          failures=0
          # We only need 20 real images. Try at most 45 candidates so the job remains
          # bounded even if some Wikimedia files are temporarily unavailable.
          for idx,info in enumerate(infos[:45],1):
              if len(accepted)>=TARGET:break
              try:
                  raw=TMP/f'{idx:03d}.bin'; norm=TMP/f'{idx:03d}.jpg'
                  print(f'DOWNLOAD {idx}: {info["title"]}',flush=True)
                  download(info['thumb'],raw)
                  normalize(raw,norm)
                  rows=tsv(norm)
                  expected,expected_source=parse_expected(info)
                  number=len(accepted)+1; fn=f'real-{number:02d}.jpg'
                  crop_real(norm,OUT/fn,rows)
                  accepted.append({
                      'name':info['title'].removeprefix('File:'),
                      'file':'./real-labels/'+fn,
                      'expected':expected,
                      'expected_source':expected_source,
                      'source_page':info['source_page'],
                      'original_url':info['original'],
                      'author':info['author'],
                      'license':info['license'],
                      'license_url':info['license_url'],
                      'description':info['description'],
                      'parent_category':info['parent_category'],
                      'ocr_preview_unverified':diagnostic(rows),
                  })
                  print('ACCEPT',number,info['title'],'expected=',expected,flush=True)
              except Exception as e:
                  failures+=1
                  print('WARN',info['title'],repr(e),flush=True)
                  time.sleep(4)

          if len(accepted)<TARGET:
              raise SystemExit(f'Collected only {len(accepted)}/{TARGET}; failures={failures}; no incomplete commit will be made')

          manifest={
              'type':'real-czech-price-label-fixtures',
              'count':len(accepted),
              'ground_truth_note':'expected is populated only when Wikimedia category metadata explicitly encodes a price; OCR preview is diagnostic and never ground truth.',
              'labels':accepted,
          }
          (OUT/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          lines=['# 20 real Czech price-label fixtures','',
                 'All JPEG files here are crops derived from real photographs on Wikimedia Commons — none are synthetic.',
                 'Source, author and licence are retained below.','',
                 '| # | File | Source | Expected from Commons metadata | Author | Licence |',
                 '|---:|---|---|---:|---|---|']
          for i,x in enumerate(accepted,1):
              name=x['name'].replace('|','\\|'); author=(x['author'] or '—').replace('|','\\|'); lic=(x['license'] or '—').replace('|','\\|')
              exp='—' if x['expected'] is None else f"{x['expected']:.2f} Kč"
              lines.append(f'| {i} | `real-{i:02d}.jpg` | [{name}]({x["source_page"]}) | {exp} | {author} | {lic} |')
          (OUT/'SOURCES.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          print('DONE',len(accepted),'real fixtures',flush=True)
          PY

      - name: Commit the 20 real photos to master
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add czk-pln/real-labels
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add 20 real Czech price label fixtures"
            git push origin HEAD:master
          fi

      - name: Deploy the committed fixtures through Pages workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref master
