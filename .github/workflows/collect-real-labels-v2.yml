# v4: collect only real Czech supermarket crops that visibly contain one price
name: Collect 20 real Czech price labels v2

on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/collect-real-labels-v2.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install OCR tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-ces
          python3 -m pip install --quiet pillow

      - name: Build 20 validated real shelf-label crops
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import html, json, math, re, shutil, subprocess, time, urllib.parse, urllib.request, urllib.error
          from pathlib import Path
          from PIL import Image, ImageOps, ImageEnhance

          API='https://commons.wikimedia.org/w/api.php'
          UA='czk-pln-real-label-fixtures/4.0 (+https://github.com/chuck101/hello)'
          OUT=Path('czk-pln/real-labels')
          TMP=Path('/tmp/czk-real-labels-v4')
          TARGET=20

          # Only real Czech retail/supermarket sources. No menus, museum boards or generic pricelists.
          SOURCE_CATEGORIES=[
              'Category:Price tags in the Czech Republic',
              'Category:Interiors of Tesco Skalka',
              'Category:Interiors of supermarkets in Prague',
              'Category:Penny Market supermarkets in Prague',
          ]

          PRICE_HINTS=('kč','kc','czk','clubcard','cena','sleva','akce','akční','penny','tesco','lidl','billa','albert','kaufland')
          DEC_RE=re.compile(r'(?<!\d)(\d{1,4})\s*[,.]\s*(\d{2})(?!\d)')
          SPLIT_RE=re.compile(r'(?<!\d)(\d{1,4})\s+(\d{2})(?!\d)')

          def open_retry(url, timeout=60, max_bytes=None, attempts=6):
              last=None
              for attempt in range(attempts):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'application/json,image/*,*/*;q=0.8'})
                      with urllib.request.urlopen(req,timeout=timeout) as r:
                          data=r.read((max_bytes+1) if max_bytes else None)
                          if max_bytes and len(data)>max_bytes: raise RuntimeError('download too large')
                          return data
                  except urllib.error.HTTPError as e:
                      last=e
                      if e.code!=429: raise
                      retry=e.headers.get('Retry-After') if e.headers else None
                      try: delay=max(10,int(retry)) if retry else min(70,10*(2**attempt))
                      except: delay=min(70,10*(2**attempt))
                      print(f'HTTP 429 -> sleep {delay}s',flush=True)
                      time.sleep(delay)
                  except Exception as e:
                      last=e
                      if attempt==attempts-1: raise
                      delay=min(30,4*(attempt+1)); print('network retry',delay,e,flush=True); time.sleep(delay)
              raise last or RuntimeError('request failed')

          def api(params):
              q=dict(params); q.update(format='json',formatversion='2',maxlag='5')
              data=open_retry(API+'?'+urllib.parse.urlencode(q),timeout=45,attempts=6)
              time.sleep(.7)
              return json.loads(data.decode('utf-8'))

          def strip_html(s):
              return re.sub(r'<[^>]+>',' ',html.unescape(str(s or ''))).strip()

          def category_files(category):
              out=[]; cont=None
              while True:
                  p={'action':'query','list':'categorymembers','cmtitle':category,'cmtype':'file','cmlimit':'max'}
                  if cont:p['cmcontinue']=cont
                  j=api(p)
                  for x in j.get('query',{}).get('categorymembers',[]): out.append((x.get('title',''),category))
                  cont=j.get('continue',{}).get('cmcontinue')
                  if not cont:break
              return out

          def batch_info(pairs):
              parent={}
              for title,cat in pairs: parent.setdefault(title,set()).add(cat)
              titles=list(parent); out=[]
              for start in range(0,len(titles),25):
                  chunk=titles[start:start+25]
                  j=api({'action':'query','titles':'|'.join(chunk),'prop':'imageinfo|categories','iiprop':'url|mime|extmetadata','iiurlwidth':'1600','cllimit':'max'})
                  for p in j.get('query',{}).get('pages',[]):
                      title=p.get('title',''); ii=(p.get('imageinfo') or [{}])[0]
                      if ii.get('mime') not in ('image/jpeg','image/png','image/webp'):continue
                      ext=ii.get('extmetadata') or {}
                      def mv(k):
                          v=ext.get(k,{})
                          if isinstance(v,dict):v=v.get('value','')
                          return strip_html(v)
                      out.append({
                          'title':title,
                          'parents':sorted(parent.get(title,set())),
                          'thumb':ii.get('thumburl') or ii.get('url'),
                          'original':ii.get('url'),
                          'source_page':'https://commons.wikimedia.org/wiki/'+urllib.parse.quote(title.replace(' ','_'),safe=':/_()'),
                          'author':mv('Artist'),'license':mv('LicenseShortName'),'license_url':mv('LicenseUrl'),
                          'description':mv('ImageDescription'),
                          'categories':[c.get('title','') for c in p.get('categories',[])],
                      })
              return out

          def rank(info):
              blob=' '.join([info['title'],info['description'],*info['parents'],*info['categories']]).lower()
              score=0
              for k in ('price tag','clubcard','akční','penny','tesco','supermarket','lidl','cena'): score += 8 if k in blob else 0
              if 'price tags in the czech republic' in blob:score+=20
              if 'tesco extra skalka' in blob:score+=8
              return score

          def download(url,path):
              path.write_bytes(open_retry(url,timeout=70,max_bytes=14*1024*1024,attempts=6)); time.sleep(1.8)

          def normalize(src,dst):
              with Image.open(src) as im:
                  im=ImageOps.exif_transpose(im).convert('RGB'); im.thumbnail((1600,1600),Image.Resampling.LANCZOS)
                  im.save(dst,'JPEG',quality=93,optimize=True)

          def tsv_image(path,psm=11):
              p=subprocess.run(['tesseract',str(path),'stdout','-l','ces+eng','--psm',str(psm),'tsv'],stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,text=True,timeout=60)
              lines=p.stdout.splitlines(); rows=[]
              if not lines:return rows
              hdr=lines[0].split('\t')
              for line in lines[1:]:
                  cols=line.split('\t')
                  if len(cols)!=len(hdr):continue
                  d=dict(zip(hdr,cols)); text=(d.get('text') or '').strip()
                  if not text:continue
                  try:
                      for k in ('left','top','width','height'):d[k]=int(d[k])
                      d['conf']=float(d['conf'])
                  except:continue
                  rows.append(d)
              return rows

          def numeric_rows(rows):
              out=[]
              for r in rows:
                  if r['conf']<8 or not re.search(r'\d',r['text']):continue
                  if r['width']<8 or r['height']<8:continue
                  out.append(r)
              out.sort(key=lambda r:r['width']*r['height'],reverse=True)
              return out[:30]

          def make_crop(src,row,dst):
              with Image.open(src) as im:
                  im=im.convert('RGB'); W,H=im.size
                  rh=max(12,row['height']); rw=max(12,row['width'])
                  ch=min(H,max(190,int(rh*5.2)))
                  cw=min(W,max(500,int(ch*2.5),int(rw*3.0)))
                  ch=min(H,max(1,int(cw/2.5)))
                  cx=row['left']+rw/2; cy=row['top']+rh/2
                  # keep more room to the right for small raised haler digits
                  x0=int(cx-cw*.40); y0=int(cy-ch*.50)
                  x0=max(0,min(W-cw,x0)); y0=max(0,min(H-ch,y0))
                  crop=im.crop((x0,y0,x0+cw,y0+ch)).resize((1200,480),Image.Resampling.LANCZOS)
                  crop.save(dst,'JPEG',quality=94,optimize=True)
                  return (x0,y0,x0+cw,y0+ch)

          def ocr_text(img_path,variant,psm):
              with Image.open(img_path) as im:
                  im=im.convert('L')
                  if variant=='contrast': im=ImageEnhance.Contrast(im).enhance(2.0)
                  elif variant=='threshold': im=im.point(lambda x:255 if x>165 else 0)
                  tmp=TMP/f'ocr-{time.time_ns()}.png'; im.save(tmp)
              try:
                  p=subprocess.run(['tesseract',str(tmp),'stdout','-l','ces+eng','--psm',str(psm)],stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,text=True,timeout=45)
                  return re.sub(r'\s+',' ',p.stdout).strip()
              finally:
                  try:tmp.unlink()
                  except:pass

          def prices(text):
              vals=[]
              cleaned=str(text).replace('O','0').replace('o','0')
              for a,b in DEC_RE.findall(cleaned):
                  v=int(a)+int(b)/100
                  if .05<v<10000:vals.append(round(v,2))
              for a,b in SPLIT_RE.findall(cleaned):
                  v=int(a)+int(b)/100
                  if .05<v<10000:vals.append(round(v,2))
              return list(dict.fromkeys(vals))

          def validate_crop(path,direct_price_tag=False):
              passes=[ocr_text(path,'raw',6),ocr_text(path,'contrast',11),ocr_text(path,'threshold',11)]
              psets=[set(prices(t)) for t in passes]
              counts={}
              for s in psets:
                  for v in s:counts[v]=counts.get(v,0)+1
              consensus=[v for v,c in counts.items() if c>=2]
              if len(consensus)!=1:return None,passes
              v=consensus[0]
              blob=' '.join(passes).lower()
              has_hint=any(h in blob for h in PRICE_HINTS)
              # Direct Czech price-tag source can pass without OCR'ing the word Kč,
              # but general supermarket photos must contain an explicit price-context hint.
              if not direct_price_tag and not has_hint:return None,passes
              return v,passes

          def iou(a,b):
              x0=max(a[0],b[0]);y0=max(a[1],b[1]);x1=min(a[2],b[2]);y1=min(a[3],b[3])
              inter=max(0,x1-x0)*max(0,y1-y0)
              if not inter:return 0
              aa=(a[2]-a[0])*(a[3]-a[1]);bb=(b[2]-b[0])*(b[3]-b[1])
              return inter/(aa+bb-inter)

          shutil.rmtree(TMP,ignore_errors=True);TMP.mkdir(parents=True)
          OUT.mkdir(parents=True,exist_ok=True)
          for p in OUT.glob('real-*.jpg'):p.unlink()
          for n in ('manifest.json','SOURCES.md'):
              p=OUT/n
              if p.exists():p.unlink()

          pairs=[]
          for cat in SOURCE_CATEGORIES:
              got=category_files(cat); print(cat,'files=',len(got),flush=True); pairs.extend(got)
          infos=batch_info(pairs); infos.sort(key=lambda x:(-rank(x),x['title']))
          print('Unique candidate photos:',len(infos),flush=True)

          accepted=[]
          for si,info in enumerate(infos[:70],1):
              if len(accepted)>=TARGET:break
              try:
                  raw=TMP/f'src-{si:03d}.bin'; norm=TMP/f'src-{si:03d}.jpg'
                  print('SOURCE',si,info['title'],flush=True)
                  download(info['thumb'],raw);normalize(raw,norm)
                  rows=tsv_image(norm,11); nums=numeric_rows(rows)
                  if not nums:continue
                  direct=any('Price tags in the Czech Republic' in x for x in info['parents']+info['categories'])
                  used=[];per_source=0
                  for ri,row in enumerate(nums):
                      if len(accepted)>=TARGET or per_source>=4:break
                      tmpcrop=TMP/f'crop-{si:03d}-{ri:02d}.jpg'
                      box=make_crop(norm,row,tmpcrop)
                      if any(iou(box,b)>.55 for b in used):continue
                      expected,passes=validate_crop(tmpcrop,direct)
                      if expected is None:continue
                      fn=f'real-{len(accepted)+1:02d}.jpg';shutil.copyfile(tmpcrop,OUT/fn)
                      used.append(box);per_source+=1
                      accepted.append({
                          'name':f'{info["title"].removeprefix("File:")} — crop {per_source}',
                          'file':'./real-labels/'+fn,
                          'expected':expected,
                          'expected_source':'automatic 3-pass OCR consensus on high-resolution real crop',
                          'reference_confidence':'2-of-3 or 3-of-3 OCR consensus; visually reviewable, not manual ground truth',
                          'source_page':info['source_page'],'original_url':info['original'],
                          'author':info['author'],'license':info['license'],'license_url':info['license_url'],
                          'description':info['description'],'source_categories':info['parents'],
                          'fixture_ocr_passes':passes,
                      })
                      print('ACCEPT',len(accepted),expected,info['title'],flush=True)
              except Exception as e:
                  print('WARN',info['title'],repr(e),flush=True);time.sleep(3)

          if len(accepted)<TARGET:
              raise SystemExit(f'Only {len(accepted)}/{TARGET} high-quality price crops passed strict validation')

          manifest={
              'type':'real-czech-supermarket-price-label-crops',
              'count':len(accepted),
              'quality_rule':'Every fixture is a crop from a real Czech retail/supermarket photograph. It is included only when three independent preprocessing passes produce exactly one price and at least two agree. General store photos also require price-context text such as Kč/cena/Clubcard.',
              'ground_truth_note':'Expected prices are automatic OCR consensus references, not manually verified ground truth. They are suitable for regression triage and should be visually corrected if a reference is ever wrong.',
              'labels':accepted,
          }
          (OUT/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          lines=['# 20 validated real Czech supermarket price crops','',
                 'Every JPG is cropped from a real Czech retail/supermarket photograph on Wikimedia Commons. Generic menus/pricelists are excluded.',
                 'A crop is kept only when 2/3 OCR preprocessing passes agree on exactly one price. Expected values are therefore automatic references, not manual ground truth.','',
                 '| # | File | Reference | Source | Author | Licence |','|---:|---|---:|---|---|---|']
          for i,x in enumerate(accepted,1):
              name=x['name'].replace('|','\\|');author=(x['author'] or '—').replace('|','\\|');lic=(x['license'] or '—').replace('|','\\|')
              lines.append(f'| {i} | `real-{i:02d}.jpg` | {x["expected"]:.2f} Kč | [{name}]({x["source_page"]}) | {author} | {lic} |')
          (OUT/'SOURCES.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          print('DONE: 20 validated real price crops',flush=True)
          PY

      - name: Commit fixtures to master
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add czk-pln/real-labels
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Replace fixtures with validated real Czech shelf labels"
            git push origin HEAD:master
          fi

      - name: Deploy committed fixtures
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref master
