# v5: only printed Czech supermarket shelf-label crops
name: Collect 20 real Czech price labels v2

on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/collect-real-labels-v2.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install OCR tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-ces
          python3 -m pip install --quiet pillow

      - name: Build 20 printed supermarket shelf-label crops
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import html, json, re, shutil, statistics, subprocess, time, urllib.parse, urllib.request, urllib.error
          from pathlib import Path
          from PIL import Image, ImageOps, ImageEnhance, ImageStat

          API='https://commons.wikimedia.org/w/api.php'
          UA='czk-pln-printed-shelf-fixtures/5.0 (+https://github.com/chuck101/hello)'
          OUT=Path('czk-pln/real-labels')
          TMP=Path('/tmp/czk-real-labels-v5')
          STAGE=TMP/'stage'
          TARGET=20

          KNOWN_FILES=[
              'File:LIDL prodejna - koutek pekárna.jpg',
              'File:Výrobky firmy SENS s cvrččí moukou v Penny.jpg',
              'File:Akční mléko Penny.jpg',
              'File:2022-08-09 Tesco Extra Skalka 15.jpg',
          ]
          SOURCE_CATEGORIES=[
              'Category:Price tags in the Czech Republic',
              'Category:Interiors of Tesco Skalka',
              'Category:Interiors of supermarkets in Prague',
              'Category:Penny Market supermarkets in Prague',
              'Category:Lidl supermarkets in Czech Republic',
          ]

          RETAIL=('supermarket','tesco','lidl','penny','billa','albert','kaufland','price tag','clubcard','akční','akcni')
          REJECT=('menu','food menu','jídelní','jidelni','ceník','cenik','pricelist','restaurant','restaurace','hotel','wc','toalet','zoo','museum','muze','vstup','entry price','parking','parkovi','jízdní','jizdni','fingerpost','blackboard','chalk','handwritten','ručně','rucne','občerstven','obcerstven')
          DEC_RE=re.compile(r'(?<!\d)(\d{1,4})\s*[,.]\s*(\d{2})(?!\d)')
          DASH_RE=re.compile(r'(?<!\d)(\d{1,4})\s*[,.]?\s*[-–—](?!\d)')
          LETTER_RE=re.compile(r'[A-Za-zÁ-ž]{2,}')

          def open_retry(url, timeout=60, max_bytes=None, attempts=6):
              last=None
              for attempt in range(attempts):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'application/json,image/*,*/*;q=0.8'})
                      with urllib.request.urlopen(req,timeout=timeout) as r:
                          data=r.read((max_bytes+1) if max_bytes else None)
                          if max_bytes and len(data)>max_bytes: raise RuntimeError('download too large')
                          return data
                  except urllib.error.HTTPError as e:
                      last=e
                      if e.code!=429: raise
                      retry=e.headers.get('Retry-After') if e.headers else None
                      try: delay=max(10,int(retry)) if retry else min(80,10*(2**attempt))
                      except: delay=min(80,10*(2**attempt))
                      print(f'HTTP 429 -> sleep {delay}s',flush=True);time.sleep(delay)
                  except Exception as e:
                      last=e
                      if attempt==attempts-1: raise
                      delay=min(30,4*(attempt+1));print('network retry',delay,e,flush=True);time.sleep(delay)
              raise last or RuntimeError('request failed')

          def api(params):
              q=dict(params);q.update(format='json',formatversion='2',maxlag='5')
              data=open_retry(API+'?'+urllib.parse.urlencode(q),timeout=45,attempts=6)
              time.sleep(.65)
              return json.loads(data.decode('utf-8'))

          def strip_html(s): return re.sub(r'<[^>]+>',' ',html.unescape(str(s or ''))).strip()

          def category_files(category):
              out=[];cont=None
              while True:
                  p={'action':'query','list':'categorymembers','cmtitle':category,'cmtype':'file','cmlimit':'max'}
                  if cont:p['cmcontinue']=cont
                  j=api(p)
                  out += [(x.get('title',''),category) for x in j.get('query',{}).get('categorymembers',[])]
                  cont=j.get('continue',{}).get('cmcontinue')
                  if not cont:break
              return out

          def batch_info(pairs):
              parent={}
              for title,cat in pairs:parent.setdefault(title,set()).add(cat)
              titles=list(parent);out=[]
              for start in range(0,len(titles),25):
                  j=api({'action':'query','titles':'|'.join(titles[start:start+25]),'prop':'imageinfo|categories','iiprop':'url|mime|extmetadata','iiurlwidth':'1900','cllimit':'max'})
                  for p in j.get('query',{}).get('pages',[]):
                      title=p.get('title','');ii=(p.get('imageinfo') or [{}])[0]
                      if ii.get('mime') not in ('image/jpeg','image/png','image/webp'):continue
                      ext=ii.get('extmetadata') or {}
                      def mv(k):
                          v=ext.get(k,{})
                          if isinstance(v,dict):v=v.get('value','')
                          return strip_html(v)
                      out.append({'title':title,'parents':sorted(parent.get(title,set())),'thumb':ii.get('thumburl') or ii.get('url'),'original':ii.get('url'),'source_page':'https://commons.wikimedia.org/wiki/'+urllib.parse.quote(title.replace(' ','_'),safe=':/_()'),'author':mv('Artist'),'license':mv('LicenseShortName'),'license_url':mv('LicenseUrl'),'description':mv('ImageDescription'),'categories':[c.get('title','') for c in p.get('categories',[])]})
              return out

          def source_blob(info): return ' '.join([info['title'],info['description'],*info['parents'],*info['categories']]).lower()
          def source_ok(info):
              b=source_blob(info)
              if any(x in b for x in REJECT):return False
              return any(x in b for x in RETAIL) or info['title'] in KNOWN_FILES
          def rank(info):
              b=source_blob(info);score=0
              if info['title'] in KNOWN_FILES:score+=100
              for x in ('price tag','tesco','lidl','penny','clubcard','supermarket','akční'):score+=12 if x in b else 0
              if 'price tags in the czech republic' in b:score+=30
              return score

          def download(url,path):path.write_bytes(open_retry(url,timeout=70,max_bytes=16*1024*1024,attempts=6));time.sleep(1.4)
          def normalize(src,dst):
              with Image.open(src) as im:
                  im=ImageOps.exif_transpose(im).convert('RGB');im.thumbnail((1900,1900),Image.Resampling.LANCZOS);im.save(dst,'JPEG',quality=94,optimize=True)

          def tsv(path,psm=11,lang='ces+eng'):
              p=subprocess.run(['tesseract',str(path),'stdout','-l',lang,'--psm',str(psm),'tsv'],stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,text=True,timeout=60)
              lines=p.stdout.splitlines();out=[]
              if not lines:return out
              hdr=lines[0].split('\t')
              for line in lines[1:]:
                  cols=line.split('\t')
                  if len(cols)!=len(hdr):continue
                  d=dict(zip(hdr,cols));txt=(d.get('text') or '').strip()
                  if not txt:continue
                  try:
                      for k in ('left','top','width','height'):d[k]=int(d[k])
                      d['conf']=float(d['conf'])
                  except:continue
                  out.append(d)
              return out

          def numeric_rows(rows):
              out=[r for r in rows if r['conf']>=18 and re.search(r'\d',r['text']) and r['width']>=8 and r['height']>=9]
              out.sort(key=lambda r:(r['width']*r['height'],r['conf']),reverse=True)
              return out[:70]

          def make_crop(src,row,dst):
              with Image.open(src) as im:
                  im=im.convert('RGB');W,H=im.size;rh=max(12,row['height']);rw=max(12,row['width'])
                  ch=min(H,max(180,int(rh*6.3)));cw=min(W,max(520,int(ch*2.7),int(rw*3.4)));ch=min(H,max(1,int(cw/2.7)))
                  cx=row['left']+rw/2;cy=row['top']+rh/2;x0=int(cx-cw*.43);y0=int(cy-ch*.50)
                  x0=max(0,min(W-cw,x0));y0=max(0,min(H-ch,y0));box=(x0,y0,x0+cw,y0+ch)
                  crop=im.crop(box).resize((1200,444),Image.Resampling.LANCZOS);crop.save(dst,'JPEG',quality=95,optimize=True);return box

          def variant(src,dst,mode):
              with Image.open(src) as im:
                  im=im.convert('L')
                  if mode=='contrast':im=ImageEnhance.Contrast(im).enhance(1.65)
                  elif mode=='threshold':im=im.point(lambda x:255 if x>170 else 0)
                  im.save(dst)

          def ocr_pass(path,mode,psm):
              tmp=TMP/f'v-{time.time_ns()}.png';variant(path,tmp,mode)
              try:
                  rows=tsv(tmp,psm);text=' '.join(r['text'] for r in rows);return re.sub(r'\s+',' ',text).strip(),rows
              finally:
                  try:tmp.unlink()
                  except:pass

          def price_values(text):
              s=str(text).replace('O','0').replace('o','0');vals=[]
              for a,b in DEC_RE.findall(s):
                  v=int(a)+int(b)/100
                  if .05<v<10000:vals.append(round(v,2))
              for a in DASH_RE.findall(s):
                  v=float(a)
                  if .05<v<10000:vals.append(round(v,2))
              return list(dict.fromkeys(vals))

          def image_print_stats(path):
              with Image.open(path) as im:
                  g=im.convert('L').resize((600,222));hist=g.histogram();total=sum(hist);dark=sum(hist[:80])/total;light=sum(hist[190:])/total
                  return dark,light

          def printed_quality(rows,path):
              good=[r for r in rows if r['conf']>=55 and len(re.sub(r'\W','',r['text'],flags=re.UNICODE))>=2]
              letters=[r for r in good if LETTER_RE.search(r['text'])]
              nums=[r for r in good if re.search(r'\d',r['text'])]
              confs=[r['conf'] for r in good]
              dark,light=image_print_stats(path)
              ok=len(good)>=4 and len(letters)>=1 and len(nums)>=1 and statistics.median(confs)>=65 and .006<=dark<=.45 and light>=.32
              return ok,{'good_tokens':len(good),'letter_tokens':len(letters),'numeric_tokens':len(nums),'median_conf':round(statistics.median(confs),1) if confs else 0,'dark_ratio':round(dark,3),'light_ratio':round(light,3)}

          def validate_crop(path):
              passes=[];all_rows=[]
              for mode,psm in [('raw',6),('contrast',11),('threshold',11)]:
                  text,rows=ocr_pass(path,mode,psm);passes.append(text);all_rows.extend(rows)
              counts={}
              for text in passes:
                  for v in set(price_values(text)):counts[v]=counts.get(v,0)+1
              consensus=[v for v,c in counts.items() if c>=2]
              if len(consensus)!=1:return None,passes,{'reason':'no single 2-of-3 price consensus'}
              ok,q=printed_quality(all_rows,path)
              if not ok:return None,passes,{'reason':'not confidently printed shelf text',**q}
              return consensus[0],passes,{'reason':'accepted printed label',**q,'votes':counts[consensus[0]]}

          def iou(a,b):
              x0=max(a[0],b[0]);y0=max(a[1],b[1]);x1=min(a[2],b[2]);y1=min(a[3],b[3]);inter=max(0,x1-x0)*max(0,y1-y0)
              if not inter:return 0
              aa=(a[2]-a[0])*(a[3]-a[1]);bb=(b[2]-b[0])*(b[3]-b[1]);return inter/(aa+bb-inter)

          shutil.rmtree(TMP,ignore_errors=True);TMP.mkdir(parents=True);STAGE.mkdir(parents=True)
          pairs=[(x,'KNOWN') for x in KNOWN_FILES]
          for cat in SOURCE_CATEGORIES:
              try:
                  got=category_files(cat);print(cat,'files=',len(got),flush=True);pairs.extend(got)
              except Exception as e:print('CATEGORY WARN',cat,e,flush=True)
          infos=[x for x in batch_info(pairs) if source_ok(x)];infos.sort(key=lambda x:(-rank(x),x['title']))
          print('Retail candidate photos:',len(infos),flush=True)

          accepted=[]
          for si,info in enumerate(infos[:120],1):
              if len(accepted)>=TARGET:break
              try:
                  raw=TMP/f'src-{si:03d}.bin';norm=TMP/f'src-{si:03d}.jpg';print('SOURCE',si,info['title'],flush=True)
                  download(info['thumb'],raw);normalize(raw,norm);nums=numeric_rows(tsv(norm,11))
                  used=[];per_source=0
                  for ri,row in enumerate(nums):
                      if len(accepted)>=TARGET or per_source>=8:break
                      crop=TMP/f'crop-{si:03d}-{ri:02d}.jpg';box=make_crop(norm,row,crop)
                      if any(iou(box,b)>.38 for b in used):continue
                      expected,passes,quality=validate_crop(crop)
                      if expected is None:
                          print(' REJECT crop',ri,quality.get('reason'),quality,flush=True);continue
                      fn=f'real-{len(accepted)+1:02d}.jpg';shutil.copyfile(crop,STAGE/fn);used.append(box);per_source+=1
                      accepted.append({'name':f'{info["title"].removeprefix("File:")} — printed label {per_source}','file':'./real-labels/'+fn,'expected':expected,'expected_source':'2-of-3 OCR consensus on a crop independently classified as printed shelf text','reference_confidence':'automatic reference; visually reviewable','source_page':info['source_page'],'original_url':info['original'],'author':info['author'],'license':info['license'],'license_url':info['license_url'],'description':info['description'],'source_categories':info['parents'],'fixture_ocr_passes':passes,'printed_quality':quality})
                      print(' ACCEPT',len(accepted),expected,quality,flush=True)
              except Exception as e:print('WARN',info['title'],repr(e),flush=True);time.sleep(2)

          if len(accepted)<TARGET:raise SystemExit(f'Only {len(accepted)}/{TARGET} genuinely printed supermarket label crops passed; old fixtures are left untouched')

          manifest={'type':'real-czech-printed-supermarket-shelf-label-crops','count':20,'quality_rule':'Only crops from Czech supermarket/retail photographs. Menu/pricelist/WC/restaurant/handwritten-type sources are rejected before OCR. Each crop must contain at least four high-confidence printed OCR tokens, including letters and digits, median token confidence >=65, plausible printed-label image density, and exactly one price agreed by at least two of three OCR passes.','ground_truth_note':'Expected prices are automatic 2-of-3 OCR consensus references and remain visually reviewable.','labels':accepted}
          (STAGE/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          lines=['# 20 printed Czech supermarket shelf-label crops','','These are real crops of printed retail shelf labels; menus, generic pricelists, WC signs and handwritten examples are excluded.','','| # | File | Reference | Source |','|---:|---|---:|---|']
          for i,x in enumerate(accepted,1):lines.append(f'| {i} | `real-{i:02d}.jpg` | {x["expected"]:.2f} Kč | [{x["name"].replace("|","/")}]({x["source_page"]}) |')
          (STAGE/'SOURCES.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')

          OUT.mkdir(parents=True,exist_ok=True)
          for p in OUT.glob('real-*.jpg'):p.unlink()
          for n in ('manifest.json','SOURCES.md'):
              p=OUT/n
              if p.exists():p.unlink()
          for p in STAGE.iterdir():shutil.copy2(p,OUT/p.name)
          print('DONE: replaced fixtures with 20 printed shelf labels',flush=True)
          PY

      - name: Commit printed fixtures
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add czk-pln/real-labels
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Replace test fixtures with printed Czech shelf labels"
            git push origin HEAD:master
          fi

      - name: Deploy committed fixtures
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref master
