name: Collect 20 real Czech price labels

on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/collect-real-labels.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install OCR tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-ces
          python3 -m pip install --quiet pillow

      - name: Find, verify and save 20 real Czech price-label photos
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import html
          import io
          import json
          import math
          import os
          import re
          import shutil
          import subprocess
          import time
          import urllib.parse
          import urllib.request
          from pathlib import Path
          from PIL import Image, ImageOps

          API = 'https://commons.wikimedia.org/w/api.php'
          UA = 'czk-pln-price-label-regression/1.0 (GitHub Actions; educational OCR fixture collector)'
          OUT = Path('czk-pln/real-labels')
          TMP = Path('/tmp/czk-real-labels')
          TARGET = 20

          # Wikimedia Commons is used deliberately: files have explicit reusable licences
          # and stable source pages. We search both direct Czech price-tag categories and
          # real supermarket interiors where shelf labels are visible.
          SEARCHES = [
              'incategory:"Price tags in the Czech Republic"',
              'incategory:"Interiors of supermarkets in Prague"',
              '"cenovka" supermarket',
              '"cenovky" supermarket',
              '"akční ceny" supermarket',
              '"akční cena" obchod',
              '"Penny" supermarket Praha',
              '"Tesco" supermarket Praha',
              '"Billa" supermarket Praha',
              '"Albert" supermarket Praha',
              '"Kaufland" supermarket Praha',
              '"Lidl" supermarket Praha',
              'supermarket Praha Czech Republic',
              'supermarket Czech Republic price',
          ]

          CZ_META = ('czech', 'česk', 'praha', 'prague', 'penny', 'tesco', 'billa', 'albert', 'kaufland', 'lidl', 'coop', 'jednota')
          PRICE_META = ('price', 'cenov', 'cena', 'akční', 'akce', 'clubcard', 'slev', 'tag', 'label', 'supermarket', 'obchod')
          PRICE_RE = re.compile(r'(?<!\d)(\d{1,4})\s*[,\.]\s*(\d{2})(?!\d)')
          WHOLE_KC_RE = re.compile(r'(?<!\d)(\d{1,4})\s*(?:kč|kc|czk)\b', re.I)

          def api(params):
              q = dict(params)
              q['format'] = 'json'
              q['formatversion'] = '2'
              url = API + '?' + urllib.parse.urlencode(q)
              req = urllib.request.Request(url, headers={'User-Agent': UA})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          def strip_html(s):
              s = html.unescape(str(s or ''))
              return re.sub(r'<[^>]+>', ' ', s)

          def meta_value(ext, key):
              v = (ext or {}).get(key)
              if isinstance(v, dict):
                  return v.get('value') or ''
              return v or ''

          def search_candidates(term):
              data = api({
                  'action': 'query',
                  'generator': 'search',
                  'gsrsearch': term,
                  'gsrnamespace': 6,
                  'gsrlimit': 50,
                  'prop': 'imageinfo|categories',
                  'iiprop': 'url|mime|extmetadata',
                  'iiurlwidth': 1600,
                  'cllimit': 'max',
              })
              return data.get('query', {}).get('pages', [])

          def candidate_info(page, query):
              ii = (page.get('imageinfo') or [{}])[0]
              mime = ii.get('mime') or ''
              if mime not in ('image/jpeg', 'image/png', 'image/webp'):
                  return None
              ext = ii.get('extmetadata') or {}
              cats = ' '.join(c.get('title', '') for c in (page.get('categories') or []))
              title = page.get('title', '')
              desc = strip_html(meta_value(ext, 'ImageDescription'))
              obj = strip_html(meta_value(ext, 'ObjectName'))
              blob = f'{title} {desc} {obj} {cats}'.lower()
              cz = sum(1 for x in CZ_META if x in blob)
              pr = sum(1 for x in PRICE_META if x in blob)
              # Direct category hits are strongest; broader supermarket results still
              # have to pass visual OCR validation below.
              meta_score = cz * 2 + pr * 2
              if 'price tags in the czech republic' in blob:
                  meta_score += 12
              if 'interiors of supermarkets in prague' in blob:
                  meta_score += 5
              thumb = ii.get('thumburl') or ii.get('url')
              if not thumb:
                  return None
              return {
                  'pageid': page.get('pageid'),
                  'title': title,
                  'query': query,
                  'thumb': thumb,
                  'original': ii.get('url') or thumb,
                  'description': desc,
                  'author': strip_html(meta_value(ext, 'Artist')),
                  'license': strip_html(meta_value(ext, 'LicenseShortName')),
                  'license_url': strip_html(meta_value(ext, 'LicenseUrl')),
                  'credit': strip_html(meta_value(ext, 'Credit')),
                  'categories': [c.get('title', '') for c in (page.get('categories') or [])],
                  'meta_score': meta_score,
                  'source_page': 'https://commons.wikimedia.org/wiki/' + urllib.parse.quote(title.replace(' ', '_'), safe=':/_()'),
              }

          def download(url, path):
              req = urllib.request.Request(url, headers={'User-Agent': UA})
              with urllib.request.urlopen(req, timeout=45) as r:
                  data = r.read(12 * 1024 * 1024 + 1)
              if len(data) > 12 * 1024 * 1024:
                  raise RuntimeError('image too large')
              path.write_bytes(data)

          def normalize_image(src, dst):
              with Image.open(src) as im:
                  im = ImageOps.exif_transpose(im).convert('RGB')
                  im.thumbnail((1600, 1600), Image.Resampling.LANCZOS)
                  im.save(dst, 'JPEG', quality=90, optimize=True)

          def tesseract_tsv(path):
              cmd = ['tesseract', str(path), 'stdout', '-l', 'ces+eng', '--psm', '11', 'tsv']
              p = subprocess.run(cmd, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, text=True, timeout=50)
              rows = []
              lines = p.stdout.splitlines()
              if not lines:
                  return rows
              hdr = lines[0].split('\t')
              for line in lines[1:]:
                  cols = line.split('\t')
                  if len(cols) != len(hdr):
                      continue
                  d = dict(zip(hdr, cols))
                  txt = (d.get('text') or '').strip()
                  if not txt:
                      continue
                  try:
                      d['left'] = int(d['left']); d['top'] = int(d['top']); d['width'] = int(d['width']); d['height'] = int(d['height']); d['conf'] = float(d['conf'])
                  except Exception:
                      continue
                  rows.append(d)
              return rows

          def text_from_rows(rows):
              return ' '.join(r['text'] for r in rows)

          def detected_prices(text):
              out = []
              for a, b in PRICE_RE.findall(text.replace(' ', '')):
                  try:
                      v = int(a) + int(b) / 100
                      if 0.05 < v < 100000:
                          out.append(round(v, 2))
                  except Exception:
                      pass
              for a in WHOLE_KC_RE.findall(text):
                  try:
                      v = float(a)
                      if 0.05 < v < 100000:
                          out.append(v)
                  except Exception:
                      pass
              # preserve order, remove duplicates
              seen = set(); result = []
              for v in out:
                  k = round(v, 2)
                  if k not in seen:
                      seen.add(k); result.append(k)
              return result

          def looks_like_price_photo(rows, info):
              raw = text_from_rows(rows)
              low = raw.lower().replace('č', 'c')
              prices = detected_prices(raw)
              has_currency = any(x in low for x in (' kc', 'kc ', 'czk', ' kč', 'kč'))
              nums = [r for r in rows if re.search(r'\d', r['text']) and r['conf'] >= 20]
              # Large numeric glyphs are a useful signal for real shelf tags even when
              # OCR misses the tiny decimal suffix/currency.
              large_num = False
              if nums:
                  areas = [r['width'] * r['height'] for r in nums]
                  large_num = max(areas) >= 1800
              score = info['meta_score'] + len(prices) * 6 + (5 if has_currency else 0) + (3 if large_num else 0)
              # Direct price-tag metadata may pass with weaker OCR. Broad supermarket
              # photos must visibly contain a price/currency or at least strong numbers.
              direct = info['meta_score'] >= 10
              ok = (direct and (prices or has_currency or large_num)) or (score >= 12 and (prices or has_currency))
              return ok, score, raw, prices

          def choose_anchor(rows, image_size):
              W, H = image_size
              numeric = []
              currency = []
              for r in rows:
                  t = r['text'].strip()
                  if re.search(r'\d', t):
                      numeric.append(r)
                  if re.search(r'k[čc]|czk', t, re.I):
                      currency.append(r)

              def area(r): return max(1, r['width'] * r['height'])
              def center(r): return (r['left'] + r['width']/2, r['top'] + r['height']/2)

              # Prefer an explicit decimal price.
              explicit = [r for r in numeric if PRICE_RE.search(r['text'].replace(' ', ''))]
              if explicit:
                  return max(explicit, key=lambda r: area(r))

              # Otherwise choose a big number nearest a Kč token.
              best = None; best_score = -1e9
              for n in numeric:
                  nx, ny = center(n)
                  s = math.log(area(n) + 1) * 2 + max(0, n['conf']) / 30
                  for c in currency:
                      cx, cy = center(c)
                      dist = math.hypot(nx-cx, ny-cy) / max(W, H)
                      s += max(0, 8 - dist * 30)
                  if s > best_score:
                      best_score = s; best = n
              return best

          def crop_label(src, dst, rows):
              with Image.open(src) as im:
                  im = im.convert('RGB')
                  W, H = im.size
                  a = choose_anchor(rows, (W, H))
                  if not a:
                      # Keep a central wide crop if OCR has no usable bbox.
                      cw = min(W, int(H * 2.5))
                      ch = min(H, int(cw / 2.5))
                      x0 = max(0, (W-cw)//2); y0 = max(0, (H-ch)//2)
                  else:
                      cx = a['left'] + a['width']/2
                      cy = a['top'] + a['height']/2
                      base_h = max(80, a['height'] * 4.8)
                      ch = min(H, int(base_h))
                      cw = min(W, int(ch * 2.5))
                      # If width hits boundary, recompute height to preserve 2.5:1.
                      ch = min(H, max(1, int(cw / 2.5)))
                      x0 = int(round(cx - cw * 0.48))
                      y0 = int(round(cy - ch * 0.50))
                      x0 = max(0, min(W-cw, x0)); y0 = max(0, min(H-ch, y0))
                  crop = im.crop((x0, y0, x0+cw, y0+ch))
                  crop = crop.resize((900, 360), Image.Resampling.LANCZOS)
                  crop.save(dst, 'JPEG', quality=92, optimize=True)

          shutil.rmtree(TMP, ignore_errors=True)
          TMP.mkdir(parents=True, exist_ok=True)
          OUT.mkdir(parents=True, exist_ok=True)

          # Remove only previously generated real fixtures, never unrelated app files.
          for p in OUT.glob('real-*.jpg'):
              p.unlink()
          for name in ('manifest.json', 'SOURCES.md'):
              p = OUT / name
              if p.exists(): p.unlink()

          candidates = {}
          for query in SEARCHES:
              try:
                  pages = search_candidates(query)
              except Exception as e:
                  print(f'WARN search {query!r}: {e}')
                  continue
              for page in pages:
                  info = candidate_info(page, query)
                  if not info:
                      continue
                  # dedupe by Commons page id/title
                  key = info['pageid'] or info['title']
                  old = candidates.get(key)
                  if old is None or info['meta_score'] > old['meta_score']:
                      candidates[key] = info
              time.sleep(0.2)

          ordered = sorted(candidates.values(), key=lambda x: (-x['meta_score'], x['title']))
          print(f'Candidate files from Commons: {len(ordered)}')

          accepted = []
          seen_sha = set()
          for idx, info in enumerate(ordered, 1):
              if len(accepted) >= TARGET:
                  break
              raw = TMP / f'cand-{idx:03d}.bin'
              norm = TMP / f'cand-{idx:03d}.jpg'
              try:
                  download(info['thumb'], raw)
                  normalize_image(raw, norm)
                  import hashlib
                  digest = hashlib.sha256(norm.read_bytes()).hexdigest()
                  if digest in seen_sha:
                      continue
                  rows = tesseract_tsv(norm)
                  ok, score, ocr_text, prices = looks_like_price_photo(rows, info)
                  print(('ACCEPT' if ok else 'reject'), score, info['title'], 'OCR=', ocr_text[:140])
                  if not ok:
                      continue
                  seen_sha.add(digest)
                  number = len(accepted) + 1
                  filename = f'real-{number:02d}.jpg'
                  crop_label(norm, OUT / filename, rows)
                  item = dict(info)
                  item.update({
                      'file': './real-labels/' + filename,
                      'expected': None,
                      'detected_prices_unverified': prices[:8],
                      'ocr_preview_unverified': ocr_text[:500],
                      'selection_score': score,
                  })
                  accepted.append(item)
              except Exception as e:
                  print(f'WARN candidate {info["title"]}: {e}')

          if len(accepted) < TARGET:
              raise SystemExit(f'Only {len(accepted)}/{TARGET} real price-label photos passed validation; refusing to commit an incomplete fixture set')

          manifest = {
              'type': 'real-czech-price-label-fixtures',
              'count': len(accepted),
              'ground_truth_status': 'not-annotated',
              'note': 'These are real photographs from Wikimedia Commons. detected_prices_unverified and OCR previews are diagnostic only and MUST NOT be treated as expected ground truth.',
              'labels': accepted,
          }
          (OUT / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          lines = [
              '# Real Czech price-label fixtures', '',
              'These 20 files are real photographs/derived crops downloaded from Wikimedia Commons, not synthetic labels.',
              'The source page, author and licence are recorded below. OCR-derived prices are deliberately marked **unverified** and are not test ground truth.', '',
              '| # | File | Commons source | Author | Licence | Unverified OCR prices |',
              '|---:|---|---|---|---|---|',
          ]
          for i, item in enumerate(accepted, 1):
              title = item['title'].replace('|', '\\|')
              author = (item['author'] or '—').replace('|', '\\|')
              lic = (item['license'] or '—').replace('|', '\\|')
              prices = ', '.join(f'{x:.2f}' for x in item['detected_prices_unverified']) or '—'
              lines.append(f'| {i} | `real-{i:02d}.jpg` | [{title}]({item["source_page"]}) | {author} | {lic} | {prices} |')
          (OUT / 'SOURCES.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')

          print(f'DONE: saved {len(accepted)} real fixtures in {OUT}')
          PY

      - name: Commit real photos permanently to repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add czk-pln/real-labels
          if git diff --cached --quiet; then
            echo "No fixture changes to commit"
            exit 0
          fi
          git commit -m "Add 20 real Czech price label fixtures"
          git push origin HEAD:master
