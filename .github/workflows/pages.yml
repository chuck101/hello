name: Deploy GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Bundle app, OCR and built-in test labels
        shell: bash
        run: |
          set -euxo pipefail
          VERSION="$(TZ=Europe/Warsaw date +'%Y.%m.%d.%H%M')-${GITHUB_SHA::7}"
          HIDDEN_PATH="r/6b9c4f2a8e17d3c5f9410a7e2d8b64c1"

          mkdir -p czk-pln/ocr/core czk-pln/ocr/lang czk-pln/test-labels
          curl -fL https://cdn.jsdelivr.net/npm/tesseract.js@6.0.1/dist/tesseract.min.js -o czk-pln/ocr/tesseract.min.js
          curl -fL https://cdn.jsdelivr.net/npm/tesseract.js@6.0.1/dist/worker.min.js -o czk-pln/ocr/worker.min.js
          for f in \
            tesseract-core.wasm.js tesseract-core.wasm \
            tesseract-core-simd.wasm.js tesseract-core-simd.wasm \
            tesseract-core-lstm.wasm.js tesseract-core-lstm.wasm \
            tesseract-core-simd-lstm.wasm.js tesseract-core-simd-lstm.wasm; do
            curl -fL "https://cdn.jsdelivr.net/npm/tesseract.js-core@6.0.0/$f" -o "czk-pln/ocr/core/$f"
          done
          curl -fL https://tessdata.projectnaptha.com/4.0.0_fast/eng.traineddata.gz -o czk-pln/ocr/lang/eng.traineddata.gz

          python3 -m pip install --quiet pillow
          python3 <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path
          import json

          out=Path('czk-pln/test-labels')
          tests=[
            ('29,90 Kč',29.90,'decimal'),('49,90 Kč',49.90,'decimal'),('9,90 Kč',9.90,'decimal'),
            ('37,90 Kč',37.90,'decimal'),('14,90 Kč',14.90,'decimal'),('29,50 Kč',29.50,'decimal'),
            ('49 + 95',49.95,'split'),('69 + 80',69.80,'split'),('29 + 90',29.90,'split'),
            ('11 + 50',11.50,'split'),('39 + 99',39.99,'split'),('19 + 20',19.20,'split')
          ]
          try:
              big=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf',170)
              small=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf',78)
              normal=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf',130)
          except:
              big=small=normal=ImageFont.load_default()
          labels=[]
          for i,(name,expected,kind) in enumerate(tests,1):
              im=Image.new('RGB',(900,360),'white'); d=ImageDraw.Draw(im)
              if kind=='decimal':
                  text=f'{expected:.2f}'.replace('.',',')
                  d.text((145,100),text,font=normal,fill='black')
              else:
                  whole=int(expected); cents=round((expected-whole)*100)
                  d.text((115,82),str(whole),font=big,fill='black')
                  d.text((420,62),f'{cents:02d}',font=small,fill='black')
              fn=f'label-{i:02d}.jpg'; im.save(out/fn,'JPEG',quality=94)
              labels.append({'name':name,'expected':expected,'file':'./test-labels/'+fn})
          (out/'manifest.json').write_text(json.dumps({'labels':labels},ensure_ascii=False,indent=2))
          PY

          sed -i 's#https://cdn.jsdelivr.net/npm/tesseract.js@6.0.1/dist/tesseract.min.js#./ocr/tesseract.min.js#g' czk-pln/index.html

          python3 - "$VERSION" <<'PY'
          from pathlib import Path
          import sys
          version=sys.argv[1]
          p=Path('czk-pln/index.html'); s=p.read_text()
          old="Tesseract.createWorker('eng',1,{logger:"
          new="Tesseract.createWorker('eng',1,{workerPath:'./ocr/worker.min.js',langPath:'./ocr/lang',corePath:'./ocr/core',logger:"
          if old not in s: raise SystemExit('createWorker pattern not found')
          s=s.replace(old,new)
          if 'id="launchOcrTest"' not in s:
              s=s.replace('<button id="resetScan" class="resetBtn" type="button">Przywróć ustawienia skanowania</button>', '<button id="resetScan" class="resetBtn" type="button">Przywróć ustawienia skanowania</button>\n  <button id="launchOcrTest" class="resetBtn" type="button">Testuj OCR na etykietach</button>',1)
          inject='<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">\n'+f'<script>window.APP_VERSION={version!r};</script>\n'
          s=s.replace('</head>',inject+'</head>',1)
          s=s.replace('<script>\n(()=>{\'use strict\';','<script src="./ocr-smart.js"></script>\n<script>\n(()=>{\'use strict\';',1)
          s=s.replace('</body>','<script src="./test-mode.js"></script>\n<script src="./update.js"></script>\n</body>',1)
          p.write_text(s)
          PY

          printf '{"version":"%s"}\n' "$VERSION" > czk-pln/version.json

          python3 - "$VERSION" <<'PY'
          from pathlib import Path
          import json,sys
          version=sys.argv[1]
          files=['./','./index.html','./manifest.json','./icon.svg','./update.js','./test-mode.js','./ocr-smart.js','./version.json',
                 './ocr/tesseract.min.js','./ocr/worker.min.js','./ocr/lang/eng.traineddata.gz',
                 './ocr/core/tesseract-core.wasm.js','./ocr/core/tesseract-core.wasm',
                 './ocr/core/tesseract-core-simd.wasm.js','./ocr/core/tesseract-core-simd.wasm',
                 './ocr/core/tesseract-core-lstm.wasm.js','./ocr/core/tesseract-core-lstm.wasm',
                 './ocr/core/tesseract-core-simd-lstm.wasm.js','./ocr/core/tesseract-core-simd-lstm.wasm',
                 './test-labels/manifest.json']+[f'./test-labels/label-{i:02d}.jpg' for i in range(1,13)]
          Path('czk-pln/sw.js').write_text(f"""const CACHE='czk-pln-{version}';
          const PRECACHE={json.dumps(files)};
          self.addEventListener('install',e=>{{e.waitUntil(caches.open(CACHE).then(c=>c.addAll(PRECACHE)));self.skipWaiting();}});
          self.addEventListener('activate',e=>{{e.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))));self.clients.claim();}});
          self.addEventListener('message',e=>{{if(e.data&&e.data.type==='SKIP_WAITING')self.skipWaiting();}});
          self.addEventListener('fetch',e=>{{if(e.request.method!=='GET')return;const u=new URL(e.request.url),same=u.origin===self.location.origin;if(same&&(e.request.mode==='navigate'||u.pathname.endsWith('/index.html')||u.pathname.endsWith('/version.json')||u.pathname.endsWith('/update.js')||u.pathname.endsWith('/test-mode.js')||u.pathname.endsWith('/ocr-smart.js'))){{e.respondWith(fetch(e.request,{{cache:'no-store'}}).catch(()=>caches.match(e.request).then(x=>x||caches.match('./index.html'))));return;}}e.respondWith(caches.match(e.request).then(c=>c||fetch(e.request).then(r=>{{if(r.ok)caches.open(CACHE).then(x=>x.put(e.request,r.clone()));return r;}})));}});
          """)
          PY

          rm -rf site
          mkdir -p "site/$HIDDEN_PATH"
          cp -a czk-pln/. "site/$HIDDEN_PATH/"
          printf 'User-agent: *\nDisallow: /\n' > site/robots.txt
          printf '<!doctype html><meta name="robots" content="noindex,nofollow"><h1>404</h1>' > site/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload hidden scanner
        uses: actions/upload-pages-artifact@v4
        with:
          path: './site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4