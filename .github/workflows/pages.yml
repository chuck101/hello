name: Deploy GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Bundle OCR and version app
        shell: bash
        run: |
          set -euxo pipefail
          VERSION="$(date -u +'%Y.%m.%d.%H%M')-${GITHUB_SHA::7}"
          mkdir -p czk-pln/ocr/core czk-pln/ocr/lang
          curl -fL https://cdn.jsdelivr.net/npm/tesseract.js@6.0.1/dist/tesseract.min.js -o czk-pln/ocr/tesseract.min.js
          curl -fL https://cdn.jsdelivr.net/npm/tesseract.js@6.0.1/dist/worker.min.js -o czk-pln/ocr/worker.min.js
          for f in \
            tesseract-core.wasm.js tesseract-core.wasm \
            tesseract-core-simd.wasm.js tesseract-core-simd.wasm \
            tesseract-core-lstm.wasm.js tesseract-core-lstm.wasm \
            tesseract-core-simd-lstm.wasm.js tesseract-core-simd-lstm.wasm; do
            curl -fL "https://cdn.jsdelivr.net/npm/tesseract.js-core@6.0.0/$f" -o "czk-pln/ocr/core/$f"
          done
          curl -fL https://tessdata.projectnaptha.com/4.0.0_fast/eng.traineddata.gz -o czk-pln/ocr/lang/eng.traineddata.gz

          sed -i 's#https://cdn.jsdelivr.net/npm/tesseract.js@6.0.1/dist/tesseract.min.js#./ocr/tesseract.min.js#g' czk-pln/index.html
          python3 - "$VERSION" <<'PY'
          from pathlib import Path
          import sys
          version=sys.argv[1]
          p=Path('czk-pln/index.html')
          s=p.read_text()
          old="Tesseract.createWorker('eng',1,{logger:"
          new="Tesseract.createWorker('eng',1,{workerPath:'./ocr/worker.min.js',langPath:'./ocr/lang',corePath:'./ocr/core',logger:"
          if old not in s:
              raise SystemExit('createWorker pattern not found')
          s=s.replace(old,new)
          marker='</head>'
          inject=f"<script>window.APP_VERSION={version!r};</script>\n"
          s=s.replace(marker,inject+marker,1)
          s=s.replace('</body>','<script src="./update.js"></script>\n</body>',1)
          p.write_text(s)
          PY

          printf '{"version":"%s"}\n' "$VERSION" > czk-pln/version.json

          cat > czk-pln/sw.js <<EOF
          const CACHE='czk-pln-${VERSION}';
          const PRECACHE=[
            './','./index.html','./manifest.json','./icon.svg','./update.js','./version.json',
            './ocr/tesseract.min.js','./ocr/worker.min.js','./ocr/lang/eng.traineddata.gz',
            './ocr/core/tesseract-core.wasm.js','./ocr/core/tesseract-core.wasm',
            './ocr/core/tesseract-core-simd.wasm.js','./ocr/core/tesseract-core-simd.wasm',
            './ocr/core/tesseract-core-lstm.wasm.js','./ocr/core/tesseract-core-lstm.wasm',
            './ocr/core/tesseract-core-simd-lstm.wasm.js','./ocr/core/tesseract-core-simd-lstm.wasm'
          ];
          self.addEventListener('install',e=>{e.waitUntil(caches.open(CACHE).then(c=>c.addAll(PRECACHE)));self.skipWaiting();});
          self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))));self.clients.claim();});
          self.addEventListener('message',e=>{if(e.data&&e.data.type==='SKIP_WAITING')self.skipWaiting();});
          self.addEventListener('fetch',e=>{
            if(e.request.method!=='GET')return;
            const url=new URL(e.request.url);
            const same=url.origin===self.location.origin;
            if(same && (e.request.mode==='navigate' || url.pathname.endsWith('/index.html'))){
              e.respondWith(fetch(e.request,{cache:'no-store'}).then(r=>{const copy=r.clone();caches.open(CACHE).then(c=>c.put('./index.html',copy)).catch(()=>{});return r;}).catch(()=>caches.match('./index.html')));
              return;
            }
            if(same && (url.pathname.endsWith('/version.json') || url.pathname.endsWith('/sw.js') || url.pathname.endsWith('/update.js'))){
              e.respondWith(fetch(e.request,{cache:'no-store'}).then(r=>{const copy=r.clone();caches.open(CACHE).then(c=>c.put(e.request,copy)).catch(()=>{});return r;}).catch(()=>caches.match(e.request)));
              return;
            }
            e.respondWith(caches.match(e.request).then(cached=>cached||fetch(e.request).then(r=>{if(r&&(r.ok||r.type==='opaque'))caches.open(CACHE).then(c=>c.put(e.request,r.clone())).catch(()=>{});return r;}).catch(()=>cached)));
          });
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload scanner
        uses: actions/upload-pages-artifact@v4
        with:
          path: './czk-pln'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
